    <circle cx="20.11" cy="21.66" r="5" fill="var(--petal)" />
    <circle cx="11.89" cy="21.66" r="5" fill="var(--petal)" />
    <circle cx="9.34" cy="13.84" r="5" fill="var(--petal)" />
